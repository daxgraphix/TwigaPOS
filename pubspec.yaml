name: twigapos
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_bloc: ^8.1.5
  get_it: ^7.6.7
  equatable: ^2.0.5

  # Functional Programming
  fpdart: ^1.1.0

  # Code Generation Annotations
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.0.0

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Utilities
  google_fonts: ^6.1.0
  vibration: ^3.1.8
  intl: ^0.20.2
  permission_handler: ^11.3.1
  fl_chart: ^0.66.1
  table_calendar: ^3.1.2
  csv: ^6.0.0
  file_picker: ^8.1.2

  # Scanner
  pretty_qr_code: ^3.3.0
  mobile_scanner: ^5.1.0
  bloc: ^8.1.4
  uuid: ^4.5.2

  # File & Storage
  path_provider: ^2.1.5 
  share_plus: ^7.2.2
  pdf: ^3.10.8

  # Authentication & Backend
  supabase_flutter: ^2.5.0

  # URL / Phone
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # App Icon Generation
  flutter_launcher_icons: ^0.13.1

  # Testing
  # Note: mockito and bloc_test require compatible versions
  # Add when needed: mockito: ^5.0.0, bloc_test: ^9.1.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.jpg"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.jpg"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.jpg"
    icon_size: 48 # min:48, max:256, default: 48

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
